<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#000000">
  <title>RepeaterShield</title>
  <style>
    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      min-height: 100%;
      background: #000;
      color: #fff;
      font-family: Arial, Helvetica, sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    main {
      width: min(100%, 760px);
      text-align: center;
    }

    .brand-image {
      display: block;
      width: 100%;
      height: auto;
      margin: 0 auto 34px;
    }

    .buttons {
      width: min(100%, 460px);
      margin: 0 auto;
      display: grid;
      gap: 16px;
    }

    .button {
      display: block;
      width: 100%;
      padding: 18px 22px;
      border: 2px solid #fff;
      border-radius: 14px;
      color: #000;
      background: #fff;
      text-decoration: none;
      font-size: 18px;
      font-weight: 700;
      letter-spacing: .01em;
      transition: transform .15s ease, opacity .15s ease;
    }

    .button.secondary {
      color: #fff;
      background: #000;
    }

    .button:hover { opacity: .86; }
    .button:active { transform: scale(.98); }

    @media (max-width: 560px) {
      body { padding: 18px; }
      .brand-image { margin-bottom: 26px; }
      .button { font-size: 17px; padding: 17px 18px; }
    }
  </style>
</head>
<body>
  <main>
    <img
      class="brand-image"
      src="repeatershield.jpg"
      alt="RepeaterShield"
    >

    <div class="buttons">
      <a
        class="button"
        href="https://m.youtube.com/@repeatershield#bottom-sheet"
        target="_blank"
        rel="noopener noreferrer"
      >
        Watch Demo
      </a>

      <a
        class="button secondary"
        href="https://www.abstractocean.com/products/repeatershield"
        target="_blank"
        rel="noopener noreferrer"
      >
        Purchase on Abstract Ocean
      </a>
    </div>
  </main>
</body>
</html>
