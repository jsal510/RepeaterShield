<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>RepeaterShield</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Exo:wght@600;700&display=swap" rel="stylesheet">

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
background:#000;
font-family:'Exo',sans-serif;
display:flex;
flex-direction:column;
justify-content:flex-start;
align-items:center;
min-height:100vh;
padding:35px 20px 20px;
}

.container{
width:100%;
max-width:760px;
text-align:center;
}

.logo{
width:100%;
display:block;
margin-bottom:32px;
}

.button{
display:block;
width:100%;
max-width:470px;
margin:18px auto;
padding:22px;
border:3px solid #fff;
border-radius:18px;
color:#fff;
text-decoration:none;
font-size:14px;
font-weight:700;
background:#000;
transition:background-color .15s,color .15s,transform .08s;
-webkit-tap-highlight-color:transparent;
}

.button:hover{
background:#fff;
color:#000;
}

.button.flash{
background:#fff;
color:#000;
transform:scale(.98);
}
</style>

<script>
function flashButton(e, btn){
    e.preventDefault();

    btn.classList.add("flash");

    setTimeout(function(){
        window.open(btn.href, "_blank");
        btn.classList.remove("flash");
    },150);
}
</script>

</head>

<body>

<div class="container">

<img src="repeatershield.jpg" class="logo">

<a class="button"
href="https://www.youtube.com/@repeatershield"
onclick="flashButton(event,this)">
Watch Demos - YouTube
</a>

<a class="button"
href="https://www.abstractocean.com/products/repeatershield"
onclick="flashButton(event,this)">
Details/Purchase - Abstract Ocean
</a>

</div>

</body>
</html>
