<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>RepeaterShield</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Exo:wght@600;700&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{
    background:#000;
    color:#fff;
    font-family:'Exo',sans-serif;
}
body{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:24px;
}
main{
    width:min(100%,760px);
}
img{
    width:100%;
    display:block;
    margin:0 auto 32px;
}
.buttons{
    max-width:470px;
    margin:0 auto;
}
.button{
    display:flex;
    justify-content:center;
    align-items:center;
    text-decoration:none;
    color:#fff;
    border:3px solid #fff;
    border-radius:18px;
    height:74px;
    margin-bottom:18px;
    font-size:1.2rem;
    font-weight:700;
    background:#000;
    transition:all .15s ease;
    -webkit-tap-highlight-color:transparent;
}
.button:hover,
.button:focus,
.button:active{
    background:#fff;
    color:#000;
}
</style>
</head>

<body>

<main>

<img src="repeatershield.jpg" alt="RepeaterShield">

<div class="buttons">

<a class="button"
href="https://www.youtube.com/@repeatershield"
target="_blank">
Watch Demo
</a>

<a class="button"
href="https://www.abstractocean.com/products/repeatershield"
target="_blank">
Purchase on Abstract Ocean
</a>

</div>

</main>
